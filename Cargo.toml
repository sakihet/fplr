[package]
name = "fplr"
version = "0.24.0"
edition = "2024"
authors = ["saki"]
description = "CLI for Fantasy Premier League"
license = "MIT"
repository = "https://github.com/sakihet/fplr"
keywords = ["fpl"]

[dependencies]
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = "4.5"
deunicode = "1.6.2"
dirs = "6.0.0"
futures = "0.3.31"
owo-colors = "4.0"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
textplots = "0.8.7"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.11"
