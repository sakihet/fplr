name: rust

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "*.md"
      - "site/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "*.md"
      - "site/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: build
      run: cargo build --verbose
    - name: run tests
      run: cargo test --verbose
